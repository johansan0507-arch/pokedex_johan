<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Pokédex · API Pokémon (Gen 1 - 9)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="pokedex-header">
    <h1>
      <span>⚡</span> Pokédex
    </h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Nombre o Nº (Global)" aria-label="Buscar Pokémon">
      <button id="searchBtn">Buscar</button>
    </div>
  </header>

  <!-- Barra de Control: Selector de Generación y Contador -->
  <section class="controls-bar" aria-label="Control de Generaciones">
    <div class="generation-selector-wrapper">
      <label for="generationSelect" class="generation-label">Región / Generación:</label>
      <select id="generationSelect" class="generation-select" aria-label="Seleccionar Generación">
        <option value="1" selected>Gen 1 · Kanto (#001 - #151)</option>
        <option value="2">Gen 2 · Johto (#152 - #251)</option>
        <option value="3">Gen 3 · Hoenn (#252 - #386)</option>
        <option value="4">Gen 4 · Sinnoh (#387 - #493)</option>
        <option value="5">Gen 5 · Teselia (#494 - #649)</option>
        <option value="6">Gen 6 · Kalos (#650 - #721)</option>
        <option value="7">Gen 7 · Alola (#722 - #809)</option>
        <option value="8">Gen 8 · Galar (#810 - #905)</option>
        <option value="9">Gen 9 · Paldea (#906 - #1025)</option>
      </select>
    </div>
    <span class="pokemon-counter-badge" id="pokemonCounterBadge">151 Pokémon</span>
  </section>

  <!-- Filtro por Tipo -->
  <section class="types-filter-wrapper" aria-label="Filtro por tipo de Pokémon">
    <div class="types-filter-container" id="typesFilterContainer">
      <button class="type-filter-btn active" data-type="all">Todos</button>
      <button class="type-filter-btn type-grass" data-type="grass">Planta</button>
      <button class="type-filter-btn type-fire" data-type="fire">Fuego</button>
      <button class="type-filter-btn type-water" data-type="water">Agua</button>
      <button class="type-filter-btn type-electric" data-type="electric">Eléctrico</button>
      <button class="type-filter-btn type-bug" data-type="bug">Bicho</button>
      <button class="type-filter-btn type-normal" data-type="normal">Normal</button>
      <button class="type-filter-btn type-poison" data-type="poison">Veneno</button>
      <button class="type-filter-btn type-ground" data-type="ground">Tierra</button>
      <button class="type-filter-btn type-fairy" data-type="fairy">Hada</button>
      <button class="type-filter-btn type-fighting" data-type="fighting">Lucha</button>
      <button class="type-filter-btn type-psychic" data-type="psychic">Psíquico</button>
      <button class="type-filter-btn type-rock" data-type="rock">Roca</button>
      <button class="type-filter-btn type-ghost" data-type="ghost">Fantasma</button>
      <button class="type-filter-btn type-ice" data-type="ice">Hielo</button>
      <button class="type-filter-btn type-dragon" data-type="dragon">Dragón</button>
      <button class="type-filter-btn type-steel" data-type="steel">Acero</button>
      <button class="type-filter-btn type-flying" data-type="flying">Volador</button>
    </div>
  </section>

  <!-- Mensajes de estado y loader -->
  <div id="statusContainer" class="status-msg" style="display: none;"></div>
  <div id="loaderContainer" class="loader" style="display: none;"></div>

  <!-- Cuadrícula de Pokémon -->
  <main id="pokedexGrid" class="pokedex-grid"></main>

  <!-- Modal de Detalles del Pokémon -->
  <dialog id="pokemonModal" class="pokemon-modal">
    <div class="modal-card" id="modalCard">
      <button class="modal-close-btn" id="modalCloseBtn" aria-label="Cerrar modal">&times;</button>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
